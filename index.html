<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101113">
<link rel="manifest" href="manifest.webmanifest">
<title>HΛLCYON Piano Tuner</title>
<style>
:root{color-scheme:dark;--bg:#101113;--panel:#191a1e;--muted:#92939a;--line:#303137;--accent:#e8e8e8;--ok:#66d99b;--warn:#f0bd69}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f5;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);min-height:100vh}
main{max-width:460px;margin:0 auto;padding:20px 0 30px}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;letter-spacing:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:20px}
label{font-size:12px;color:var(--muted)}select{display:block;width:100%;padding:13px 12px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:#222328;color:white;font-size:16px}
.note{font-size:66px;font-weight:700;letter-spacing:-3px;text-align:center;margin-top:25px}.freq{text-align:center;color:var(--muted);font-size:14px;margin-top:3px}.cents{text-align:center;font-size:21px;margin-top:24px}
.meter{height:9px;background:#34343a;border-radius:99px;position:relative;margin:27px 4px 10px}.centerline{position:absolute;left:50%;top:-6px;height:21px;width:2px;background:#888}.needle{position:absolute;left:50%;top:-4px;height:17px;width:4px;border-radius:4px;background:#aaa;transform:translateX(-50%);transition:left .08s}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin:0 4px}
.status{text-align:center;color:var(--muted);min-height:23px;margin-top:25px;font-size:14px}
button{border:0;border-radius:12px;font-weight:650;cursor:pointer}.mic{width:100%;padding:15px;margin-top:9px;background:#f1f1f2;color:#141414;font-size:15px}.mic.stop{background:#34343a;color:#f2f2f2}.row{display:flex;gap:10px;margin-top:12px}.small{background:#27282d;color:#eee;border:1px solid #3a3a40;padding:11px;flex:1}
.tip{text-align:center;font-size:11px;color:#707078;margin:14px 8px 0}.range{margin-top:18px}
</style>
</head>
<body><main>
<div class="top"><span>HΛLCYON · PIANO TUNER</span><span>88 TASTI</span></div>
<div class="panel">
<label for="key">Tasto obiettivo</label>
<select id="key"></select>
<div class="note" id="note">—</div><div class="freq" id="freq">Microfono spento</div>
<div class="cents" id="cents">— cents</div>
<div class="meter"><div class="centerline"></div><div class="needle" id="needle"></div></div>
<div class="scale"><span>♭ CALANTE</span><span>IN TUNE</span><span>♯ CRESCENTE</span></div>
<div class="status" id="status">Premi attiva e suona una nota</div>
<button class="mic" id="mic">Attiva microfono</button>
<div class="row"><button class="small" id="a440">Riferimento La 440 Hz</button><button class="small" id="reset">Centra indicatore</button></div>
<div class="tip">Accordatura standard · Temperamento equabile · A4 = 440 Hz</div>
</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), names=["Do","Do♯","Re","Re♯","Mi","Fa","Fa♯","Sol","Sol♯","La","La♯","Si"];
const sharp=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
function hz(m){return 440*Math.pow(2,(m-69)/12)}
for(let m=21;m<=108;m++){let opt=document.createElement('option');opt.value=m;opt.textContent=names[m%12]+" "+(Math.floor(m/12)-1)+" · "+hz(m).toFixed(2)+" Hz";if(m===69)opt.selected=true;$('key').append(opt)}
let stream=null,ctx=null,an=null,buf=null,active=false,raf=0;
function detectPitch(data,sr){
 let rms=0;for(let i=0;i<data.length;i++)rms+=data[i]*data[i];rms=Math.sqrt(rms/data.length);if(rms<.012)return null;
 // Center the signal and use autocorrelation with normalized lag scoring.
 let mean=0;for(let v of data)mean+=v;mean/=data.length;
 let maxLag=Math.min(Math.floor(sr/45),data.length/2),minLag=Math.max(2,Math.floor(sr/1000));
 let bestLag=-1,best=-1;
 for(let lag=minLag;lag<=maxLag;lag++){
   let corr=0,n=data.length-lag;
   for(let i=0;i<n;i++)corr+=(data[i]-mean)*(data[i+lag]-mean);
   corr/=n;
   if(corr>best){best=corr;bestLag=lag}
 }
 if(bestLag<1||best<.15)return null;
 let lag=bestLag;
 if(lag>1&&lag<maxLag){let c0=0,c1=0,c2=0,n=data.length-lag;
  for(let i=0;i<n-1;i++){let x=data[i]-mean;c0+=x*(data[i+lag-1]-mean);c1+=x*(data[i+lag]-mean);c2+=x*(data[i+lag+1]-mean)}
  let d=c0-2*c1+c2;if(d!==0)lag+=.5*(c0-c2)/d;
 }
 return sr/lag;
}
function frame(){
 if(!active)return;an.getFloatTimeDomainData(buf);
 let f=detectPitch(buf,ctx.sampleRate), target=hz(Number($('key').value));
 if(f&&f>25&&f<1500){
  let midi=Math.round(69+12*Math.log2(f/440)), cents=1200*Math.log2(f/target);
  $('note').textContent=sharp[(midi%12+12)%12]+(Math.floor(midi/12)-1);
  $('freq').textContent=f.toFixed(2)+" Hz · obiettivo "+target.toFixed(2)+" Hz";
  $('cents').textContent=(cents>=0?"+":"")+cents.toFixed(1)+" cents";
  $('needle').style.left=(50+Math.max(-50,Math.min(50,cents))*.82)+"%";
  if(Math.abs(cents)<=3){$('status').textContent="✓ Accordato";$('status').style.color="var(--ok)"}
  else if(cents<0){$('status').textContent="↓ Troppo basso · alza leggermente";$('status').style.color="var(--warn)"}
  else{$('status').textContent="↑ Troppo alto · abbassa leggermente";$('status').style.color="var(--warn)"}
 }else{
  $('note').textContent="—";$('freq').textContent="In ascolto…";$('cents').textContent="— cents";$('needle').style.left="50%";$('status').textContent="Suona una nota singola";$('status').style.color="var(--muted)"
 }
 raf=requestAnimationFrame(frame)
}
$('mic').onclick=async()=>{
 if(active){active=false;cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());await ctx.close();ctx=null;stream=null;$('mic').textContent="Attiva microfono";$('mic').classList.remove('stop');$('status').textContent="Microfono spento";$('status').style.color="var(--muted)";return}
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  ctx=new AudioContext();await ctx.resume();let source=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=8192;an.smoothingTimeConstant=.05;source.connect(an);buf=new Float32Array(an.fftSize);active=true;$('mic').textContent="Disattiva microfono";$('mic').classList.add('stop');frame();
 }catch(err){$('status').textContent="Microfono negato/non disponibile. Apri la web app da Safari su HTTPS e autorizza il microfono."; $('status').style.color="var(--warn)"}
};
$('a440').onclick=()=>{const osc=ctx?.createOscillator(),gain=ctx?.createGain();if(!ctx)return;osc.frequency.value=440;gain.gain.value=.15;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.7)};
$('reset').onclick=()=>{$('needle').style.left="50%";$('cents').textContent="— cents"};
})();
</script></body></html>
